<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priprema za ispit - Algebra Web Dizajn</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* === OPĆI STILOVI STRANICE ZA UČENJE === */
        body {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #2b3e50;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 10px 0;
        }

        nav.toc {
            background-color: #e9ecef;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        nav.toc ul {
            margin: 0;
            padding-left: 20px;
        }

        section {
            background: #ffffff;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: block;
        }

        h2 {
            color: #2b3e50;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
            margin-top: 0;
        }

        h3 {
            color: #007bff;
            margin-top: 20px;
        }

        .qa-block {
            margin-bottom: 18px;
            border-bottom: 1px dashed #dee2e6;
            padding-bottom: 10px;
        }

        .question {
            font-weight: bold;
            color: #1a252f;
        }

        .answer {
            margin-top: 4px;
            color: #495057;
        }

        .practical-box {
            background-color: #f1f3f5;
            border-left: 4px solid #28a745;
            padding: 20px;
            margin: 25px 0;
            border-radius: 0 6px 6px 0;
        }

        /* === STILOVI ZA PRAKTIČNE VJEŽBE (HTML & CSS) === */
        p.styled-p {
            margin: 10px 15px 10px 15px;
            background-color: #e2e8f0;
            padding: 10px;
            border-radius: 4px;
        }

        img.demo-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
            border-radius: 4px;
        }

        table.demo-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin: 15px 0;
            background-color: #fff;
        }

        table.demo-table, table.demo-table th, table.demo-table td {
            border: 1px solid #333;
        }

        table.demo-table td, table.demo-table th {
            padding: 10px;
            text-align: center;
        }

        form.demo-form {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .div-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .div1 {
            width: 160px;
            height: 160px;
            background-color: purple;
            border: 2px solid yellow;
            margin: 10px;
            padding: 15px;
            box-sizing: content-box;
            color: white;
            font-weight: bold;
        }

        .div2 {
            width: 160px;
            height: 160px;
            background-color: purple;
            border: 2px solid yellow;
            margin: 10px;
            padding: 15px;
            box-sizing: border-box;
            background-image: url('https://via.placeholder.com/100');
            background-repeat: no-repeat;
            background-size: 50%;
            background-position: center;
            color: white;
            font-weight: bold;
        }

        .div3 {
            width: 300px;
            height: 120px;
            background: linear-gradient(to right, red, blue);
            border: 1px solid black;
            padding: 10px;
            color: white;
            font-weight: bold;
        }

        /* === PARCIJALNI ISPIT LAYOUT (Prilagođen i odzivan) === */
        .exam-wrapper {
            overflow-x: auto;
            padding-bottom: 15px;
        }

        .exam-container {
            width: 1060px;
            max-width: 100%;
            margin: 20px auto;
            background-color: #7d7d7d;
            font-family: Arial, sans-serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            color: #000;
            box-sizing: border-box;
        }

        .exam-header {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
        }

        .exam-nav {
            background-color: #ff55ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .exam-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .exam-nav ul li a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
        }

        .exam-search {
            display: flex;
        }

        .exam-search input[type="text"] {
            padding: 5px;
            border: none;
        }

        .exam-search button {
            background-color: #333;
            color: white;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
        }

        .exam-main {
            display: flex;
            background-color: #fff;
        }

        .exam-content {
            width: 80%;
            padding: 20px;
            box-sizing: border-box;
        }

        .exam-sidebar {
            width: 20%;
            background-color: #ff77ff;
            padding: 20px;
            box-sizing: border-box;
        }

        .exam-sidebar h3 {
            font-style: italic;
            font-size: 24px;
            margin-top: 0;
            color: #000;
            border: none;
        }

        .exam-sidebar ul {
            padding-left: 20px;
        }

        .exam-sidebar a {
            color: blue;
        }

        .exam-footer {
            background-color: #fff;
            padding: 15px;
            border-top: 1px solid #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body id="top">

    <header>
        <h1>Priprema za ispit – Algebra</h1>
        <p>Sva teorijska pitanja po sistemu 1 pitanje - 1 odgovor i gotove vježbe s točnim kodom u jednoj datoteci.</p>
    </header>

    <!-- Navigacija / Sadržaj -->
    <nav class="toc">
        <h3>Sadržaj</h3>
